name: CLI Contracts

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-contracts:
    name: Verify CLI Effects And Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Verify Contracts
        run: npm run verify:contracts

      - name: Verify Effects
        run: npm run verify:effects
