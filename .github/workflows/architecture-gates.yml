name: Architecture Gates

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanliness:
    name: Verify Branch And Gate Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fetch Announced Remote Head
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${GITHUB_HEAD_REF}:refs/remotes/origin/${GITHUB_HEAD_REF}" \
            "+refs/heads/dev:refs/remotes/origin/dev" \
            "+refs/heads/main:refs/remotes/origin/main"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Install Locked Gate Dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Verify Cleanliness With Remote Provenance
        env:
          AIDN_BRANCH_POLICY_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          AIDN_BRANCH_POLICY_CONTAINS_REF: origin/${{ github.head_ref }}
        run: npm run verify:cleanliness

  contracts:
    name: Verify Contracts And Effects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - run: npm run verify:contracts
      - run: npm run verify:effects

  governance:
    name: Verify Information Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - run: npm run verify:governance

  runtime:
    name: Verify Runtime Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - run: npm run verify:runtime

  codex:
    name: Verify Codex Installed Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - run: npm run verify:codex

  security:
    name: Verify Security Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - run: npm run verify:security

  docs:
    name: Verify Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - run: npm run verify:docs
