name: Agentic Fixture Segment

on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      context:
        required: true
        type: string
      segment:
        required: true
        type: number

permissions:
  contents: read

jobs:
  fixtures:
    name: Run Required Agentic Fixture Segment
    runs-on: ${{ inputs.segment >= 14 && inputs.segment <= 16 && 'windows-2025' || 'ubuntu-latest' }}
    steps:
      - name: Checkout Exact Candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install Locked Gate Dependencies
        run: npm ci --include=dev --include=optional --ignore-scripts --no-audit --no-fund

      - name: Resolve Ephemeral PostgreSQL Runtime
        run: node tools/ci/resolve-postgres-test-runtime.mjs

      - name: Run Required Segment
        env:
          AIDN_AGENTIC_SOURCE_SHA: ${{ inputs.source }}
          AIDN_AGENTIC_SEGMENT: ${{ inputs.segment }}
          AIDN_GATE_CONTEXT: ${{ inputs.context }}
        run: node tools/ci/run-agentic-fixture-segment.mjs

      - name: Retain Required Segment Receipt
        uses: actions/upload-artifact@v4
        with:
          name: aidn-agentic-segment-${{ inputs.segment }}
          path: ${{ runner.temp }}/aidn-agentic-segment.json
          if-no-files-found: error
          overwrite: true
